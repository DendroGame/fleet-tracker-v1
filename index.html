<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body class="h-full bg-slate-900 text-slate-100">
  <div id="sidebar-overlay" class="fixed inset-0 z-40 bg-black/60 hidden" onclick="toggleSidebar()"></div>
  <div id="app" class="flex h-full overflow-hidden">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-950 border-r border-slate-800 flex flex-col -translate-x-full md:static md:translate-x-0">
      <div class="px-5 py-4 border-b border-slate-800"><div class="font-semibold">Fleet Tracker</div><div class="text-xs text-slate-400">v1.3</div></div>
      <div class="px-4 py-3 border-b border-slate-800"><div class="text-xs text-slate-500 uppercase">Now selected</div><div id="now-selected" class="mt-1">None</div><select id="asset-select" class="hidden" onchange="switchAsset(this.value)"></select></div>
      <nav class="px-3 py-3 space-y-1 flex-1 overflow-y-auto">
        <button data-view="garage" class="nav-btn active" onclick="showView('garage')">Garage</button>
        <button data-view="dashboard" class="nav-btn" onclick="showView('dashboard')">Dashboard</button>
        <button data-view="service" class="nav-btn" onclick="showView('service')">Service</button>
        <button data-view="fuel" class="nav-btn" onclick="showView('fuel')">Fuel</button>
        <button data-view="supplies" class="nav-btn" onclick="showView('supplies')">Supplies</button>
        <button data-view="inspections" class="nav-btn" onclick="showView('inspections')">Inspections</button>
        <button data-view="reminders" class="nav-btn" onclick="showView('reminders')">Reminders</button>
        <button data-view="tools" class="nav-btn" onclick="showView('tools')">Tools</button>
      </nav>
      <div class="px-3 py-3 border-t border-slate-800 space-y-1">
        <div class="text-xs text-slate-500 uppercase px-2 pb-1">Settings</div>
        <button data-settings="accounts" class="nav-btn" onclick="showSettings('accounts')">Accounts</button>
        <button data-settings="dashboard" class="nav-btn" onclick="showSettings('dashboard')">Dashboard display</button>
        <button data-settings="general" class="nav-btn" onclick="showSettings('general')">General</button>
        <button class="nav-btn" onclick="sessionStorage.removeItem('ft_token'); location.reload();">Sign out</button>
      </div>
    </aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header class="px-4 py-3 border-b border-slate-800 flex items-center gap-3"><button class="md:hidden px-3 py-2 rounded-lg bg-slate-800" onclick="toggleSidebar()">Menu</button><div><h1 id="view-title">Garage</h1><p id="view-subtitle" class="text-xs text-slate-400"></p></div><span id="asset-status-badge" class="status-badge ml-auto"></span></header>
      <main id="main-content" class="flex-1 overflow-y-auto p-4"></main>
    </div>
  </div>
  <div id="modal-root" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4"><div class="absolute inset-0 bg-black/70" onclick="closeModal()"></div><div id="modal-content" class="relative bg-slate-900 border border-slate-700 rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto"></div></div>
  <div id="toast" class="fixed bottom-4 right-4 z-[70] hidden"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api-crud.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views-garage-dashboard.js"></script>
  <script src="js/views-service-fuel.js"></script>
  <script src="js/views-supplies-inspections.js"></script>
  <script src="js/views-reminders.js"></script>
  <script src="js/views-tools-export.js"></script>
  <script src="js/views-photo.js"></script>
  <script src="js/views-files.js"></script>
  <script src="js/views-settings.js"></script>
  <script src="js/views-tiles.js"></script>
  <script src="js/views-states.js"></script>
  <script src="js/views-service-needed.js"></script>
  <script src="js/views-tile-state.js"></script>
  <script src="js/views-tile-stats.js"></script>
  <script src="js/views-tile-options.js"></script>
  <script src="js/views-settings-tiles.js"></script>
  <script src="js/views-types.js"></script>
  <script src="js/views-photo-r2.js"></script>
  <script src="js/views-hide-delete.js"></script>
  <script src="js/views-hard-delete.js"></script>
  <script src="js/views-vehicle-dashboard.js"></script>
  <script src="js/views-fuel-axis.js"></script>
  <script src="js/views-miles-fuel.js"></script>
  <script src="js/views-dash-links.js"></script>
  <script src="js/views-tile-visuals.js"></script>
  <script src="js/views-repairs.js"></script>
  <script src="js/views-asset-settings.js"></script>
  <script src="js/views-reviewed.js"></script>
  <script src="js/views-hide-hours.js"></script>
  <script src="js/views-tag-tiles.js"></script>
  <script src="js/views-tile-move.js"></script>
  <script src="js/views-tile-layout.js"></script>
  <script src="js/views-tile-fill.js"></script>
  <script src="js/views-now-selected.js"></script>
  <script src="js/views-reminder-preset.js"></script>
  <script src="js/views-acq-reminders.js"></script>
  <script src="js/views-acq-field.js"></script>
  <script src="js/views-preset-drop.js"></script>
  <script src="js/views-hide-preset-box.js"></script>
  <script src="js/views-reminder-edit.js"></script>
  <script src="js/views-hide-type.js"></script>
  <script src="js/views-calc-mode.js"></script>
  <script src="js/views-machine-hour.js"></script>
  <script src="js/views-one-file.js"></script>
  <script src="js/views-part-number.js"></script>
  <script src="js/views-service-break.js"></script>
  <script src="js/views-service-pie.js"></script>
  <script src="js/views-next-reminders.js"></script>
  <script src="js/views-d1-delete.js"></script>
  <script src="js/views-cap-repairs.js"></script>
  <script src="js/views-partial-fill.js"></script>
  <script src="js/views-reminder-levels.js"></script>
  <script src="js/views-trailer-odo.js"></script>
  <script src="js/views-cdl-preset.js"></script>
  <script src="js/views-inspect-banner.js"></script>
  <script src="js/views-status-color.js"></script>
  <script src="js/views-photo-sync.js"></script>
  <script src="js/views-photo-show.js"></script>
  <script src="js/views-tile-contrast.js"></script>
  <script src="js/views-photo-pick.js"></script>
</body>
</html>
